name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The docs' SQL Server examples run against this server (DBTOREST_TEST_SQLSERVER below); without
    # the variable, those tests are skipped. They wait for it to accept connections, so the service
    # needs no health check. The password only guards this job's own container.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Docs_Examples_2026"
        ports:
          - 1433:1433

    env:
      DBTOREST_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Docs_Examples_2026;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # The image the Docker workflow publishes for a release tag, built and run on every push but not
  # pushed, so a change that breaks it fails here and not at the release.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dbtorestapi:ci

      - name: Run the image, call an endpoint, check the docs are in it
        run: |
          docker run -d --name engine -p 5000:5000 dbtorestapi:ci
          for i in $(seq 1 30); do curl -sf http://localhost:5000/server_time > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5000/server_time || { docker logs engine; exit 1; }
          docker exec engine test -f /app/AGENTS.md -a -f /app/llms.txt -a -f /app/docs/reference/tags.md
