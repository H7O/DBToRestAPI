name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Full builds — every supported database provider
          - rid: win-x64
            flavor: full
            artifact: DBToRestAPI-win-x64
          - rid: win-arm64
            flavor: full
            artifact: DBToRestAPI-win-arm64
          - rid: linux-x64
            flavor: full
            artifact: DBToRestAPI-linux-x64
          - rid: linux-arm64
            flavor: full
            artifact: DBToRestAPI-linux-arm64
          - rid: osx-x64
            flavor: full
            artifact: DBToRestAPI-osx-x64
          - rid: osx-arm64
            flavor: full
            artifact: DBToRestAPI-osx-arm64
          # Lite builds — Microsoft SQL Server + SQLite only, Workstation GC (small / low-RAM hosts)
          - rid: linux-x64
            flavor: lite
            artifact: DBToRestAPI-lite-linux-x64
          - rid: linux-arm64
            flavor: lite
            artifact: DBToRestAPI-lite-linux-arm64
          - rid: win-x64
            flavor: lite
            artifact: DBToRestAPI-lite-win-x64
          - rid: win-arm64
            flavor: lite
            artifact: DBToRestAPI-lite-win-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish DBToRestAPI/DBToRestAPI.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:DbProviders=${{ matrix.flavor }}
          --output ./publish/${{ matrix.artifact }}

      - name: Package (tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win') }}
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C ./publish ${{ matrix.artifact }}

      - name: Package (zip)
        if: startsWith(matrix.rid, 'win')
        run: cd ./publish && zip -r ../${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # Framework-dependent, portable lite build (no RID) — a tiny download for hosts that already have
  # the ASP.NET Core runtime installed. SQL Server + SQLite only, Workstation GC. Runs on any OS/arch.
  publish-lite-portable:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish (framework-dependent, lite)
        run: >
          dotnet publish DBToRestAPI/DBToRestAPI.csproj
          --configuration Release
          --no-self-contained
          -p:DbProviders=lite
          --output ./publish/DBToRestAPI-lite-portable

      - name: Package
        run: |
          tar -czf DBToRestAPI-lite-portable.tar.gz -C ./publish DBToRestAPI-lite-portable
          cd ./publish && zip -r ../DBToRestAPI-lite-portable.zip DBToRestAPI-lite-portable

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DBToRestAPI-lite-portable
          path: DBToRestAPI-lite-portable.*

  release:
    needs: [publish, publish-lite-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
